<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2138"/>
      <stop offset="1" stop-color="#383B5D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58C7E8" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#58C7E8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58C7E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AE5F7"/>
      <stop offset="1" stop-color="#3FA9CD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle technical grid -->
  <g stroke="#D9DDEE" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 64 H512 M0 128 H512 M0 192 H512 M0 256 H512 M0 320 H512 M0 384 H512 M0 448 H512"/>
    <path d="M64 0 V512 M128 0 V512 M192 0 V512 M256 0 V512 M320 0 V512 M384 0 V512 M448 0 V512"/>
  </g>

  <!-- Corner ticks -->
  <g stroke="#58C7E8" stroke-opacity="0.4" stroke-width="3" fill="none">
    <path d="M40 64 V40 H64"/>
    <path d="M472 64 V40 H448"/>
    <path d="M40 448 V472 H64"/>
    <path d="M472 448 V472 H448"/>
  </g>

  <!-- Cyan glow halo behind the mark -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Outer diamond ring -->
  <path d="M256 96 L416 256 L256 416 L96 256 Z"
        fill="none" stroke="url(#diamondStroke)" stroke-width="14"
        stroke-linejoin="round"/>

  <!-- Inner diamond (filled) -->
  <path d="M256 168 L344 256 L256 344 L168 256 Z"
        fill="#58C7E8" opacity="0.92"/>

  <!-- Center pinhole -->
  <circle cx="256" cy="256" r="14" fill="#1E2138"/>

  <!-- Bottom faction-color tick row -->
  <g>
    <rect x="172" y="448" width="28" height="6" rx="2" fill="#62C7E6"/>
    <rect x="207" y="448" width="28" height="6" rx="2" fill="#F1C94B"/>
    <rect x="242" y="448" width="28" height="6" rx="2" fill="#E89042"/>
    <rect x="277" y="448" width="28" height="6" rx="2" fill="#B987C9"/>
    <rect x="312" y="448" width="28" height="6" rx="2" fill="#8CCB6A"/>
  </g>
</svg>
